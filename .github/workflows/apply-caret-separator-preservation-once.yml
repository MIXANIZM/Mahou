name: Apply caret separator preservation once

on:
  push:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write

concurrency:
  group: apply-caret-separator-preservation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Decode and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/preserve-caret-separators.patch.gz.b64 | gzip -d > /tmp/preserve-caret-separators.patch
          echo 'de10ddca57b008de5a8652cb764805f8fdfe244f657ee19594a2614801fe5ce9  /tmp/preserve-caret-separators.patch' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import json

          files = [
              Path('.github/scripts/security-regression.py'),
              Path('Mahou/Classes/KMHook.cs'),
              Path('Mahou/Classes/SelectionProbe.cs'),
          ]
          bom = b'\xef\xbb\xbf'
          meta = {}
          for path in files:
              raw = path.read_bytes()
              has_bom = raw.startswith(bom)
              if has_bom:
                  raw = raw[len(bom):]
              meta[str(path)] = {'bom': has_bom, 'crlf': b'\r\n' in raw}
              path.write_bytes(raw.decode('utf-8').replace('\r\n', '\n').encode('utf-8'))
          Path('/tmp/preserve-caret-separators-meta.json').write_text(json.dumps(meta), encoding='utf-8')
          PY

          git apply --check /tmp/preserve-caret-separators.patch
          git apply /tmp/preserve-caret-separators.patch

          python3 - <<'PY'
          from pathlib import Path
          import json

          bom = b'\xef\xbb\xbf'
          meta = json.loads(Path('/tmp/preserve-caret-separators-meta.json').read_text(encoding='utf-8'))
          for name, info in meta.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              raw = (text.replace('\n', '\r\n') if info['crlf'] else text).encode('utf-8')
              if info['bom']:
                  raw = bom + raw
              path.write_bytes(raw)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          grep -Fq 'RestoreCaretPastPreservedSeparators' Mahou/Classes/KMHook.cs
          grep -Fq 'ReselectGeneratedCaretWordWithoutSeparators' Mahou/Classes/KMHook.cs
          grep -Fq 'out int trailingSeparatorCount' Mahou/Classes/SelectionProbe.cs

      - name: Commit and push product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/security-regression.py Mahou/Classes/KMHook.cs Mahou/Classes/SelectionProbe.cs
          git commit -m 'fix: preserve separators after caret-word conversion'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
