name: Apply caret word conversion once

on:
  push:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1

      - name: Apply verified caret-word patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/caret-word.patch
          git apply --check /tmp/caret-word.patch
          git apply /tmp/caret-word.patch
          rm -- .github/workflows/apply-caret-word-once.yml
          python3 .github/scripts/security-regression.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/security-regression.py Mahou/Classes/KMHook.cs Mahou/Classes/SelectionProbe.cs .github/workflows/apply-caret-word-once.yml
          git commit -m 'feat: convert word before caret with Insert'
          git push
