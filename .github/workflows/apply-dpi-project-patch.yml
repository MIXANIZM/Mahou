name: Apply DPI project patch

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
    paths:
      - .github/workflows/apply-dpi-project-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0

      - name: Patch project file
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Mahou/Mahou.csproj')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    <AssemblyName>Mahou</AssemblyName>\n    <TargetFrameworkVersion>v4.8</TargetFrameworkVersion>',
              '    <AssemblyName>Mahou</AssemblyName>\n    <ApplicationManifest>app.manifest</ApplicationManifest>\n    <TargetFrameworkVersion>v4.8</TargetFrameworkVersion>',
              'application manifest property')

          replace_once(
              '    <Compile Include="Classes\\Configs.cs" />\n    <Compile Include="Classes\\SecretProtector.cs" />',
              '    <Compile Include="Classes\\Configs.cs" />\n    <Compile Include="Classes\\DpiAccessibility.cs" />\n    <Compile Include="Classes\\SecretProtector.cs" />',
              'DPI helper compile item')

          replace_once(
              '  <ItemGroup>\n    <None Include="App.config" />\n  </ItemGroup>',
              '  <ItemGroup>\n    <None Include="App.config" />\n    <None Include="app.manifest" />\n  </ItemGroup>',
              'manifest content item')

          path.write_text(text.replace('\n', '\r\n'), encoding='utf-8')
          '@ | Set-Content -Path patch_project.py -Encoding utf8
          python patch_project.py
          Remove-Item patch_project.py

      - name: Commit guarded patch and remove workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-dpi-project-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mahou/Mahou.csproj .github/workflows/apply-dpi-project-patch.yml
          git diff --cached --check
          git commit -m "Wire PerMonitorV2 manifest and accessibility helper"
          git push origin HEAD:mixanizm-adaptive-layout-learning
