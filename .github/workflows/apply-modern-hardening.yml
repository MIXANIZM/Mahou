name: Apply modern hardening

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-modern-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'mixanizm-modern-v2.9.0.1' || github.ref_name == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Validate and apply complete patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardening-diagnostics
          cat .github/hardening-parts/part-*.patch > /tmp/modern-hardening.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/modern-hardening.patch')
          text = path.read_text(encoding='utf-8')

          patterns = [
              re.compile(
                  r'@@ -10,7 \+10,8 @@ using System\.Text\.RegularExpressions;\n.*?'
                  r'(?=@@ -37,7 \+38,7 @@ namespace Mahou \{)',
                  re.S,
              ),
              re.compile(
                  r'@@ -3961,7 \+3980,8 @@ namespace Mahou \{\n.*?'
                  r'(?=diff --git a/Mahou/Classes/Logging\.cs)',
                  re.S,
              ),
          ]
          for index, pattern in enumerate(patterns, 1):
              text, count = pattern.subn('', text, count=1)
              if count != 1:
                  raise SystemExit('Expected legacy CR-only hunk group %d was not found exactly once' % index)
          path.write_text(text, encoding='utf-8')
          PY
          cp /tmp/modern-hardening.patch hardening-diagnostics/modern-hardening.patch
          if ! git apply --recount --check /tmp/modern-hardening.patch > hardening-diagnostics/apply-check.txt 2>&1; then
            cat hardening-diagnostics/apply-check.txt
            exit 1
          fi
          git apply --recount --whitespace=nowarn /tmp/modern-hardening.patch
          rm -rf .github/hardening-parts
          rm -f .github/workflows/apply-modern-hardening.yml
          git diff --check

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-hardening-diagnostics
          path: hardening-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Commit hardened modern baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden modern Mahou baseline"
          git push origin HEAD:mixanizm-modern-v2.9.0.1
