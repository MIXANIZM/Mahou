name: Apply queued layout switching patch

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
    paths:
      - .github/workflows/apply-layout-switch-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Mahou/Classes/KMHook.cs')
          raw = path.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          if bom:
              raw = raw[3:]
          text = raw.decode('utf-8').replace('\r\n', '\n')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''\t\t\tif(!self && !shift && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "CapsLock" &&
          \t\t\t\tKey == Keys.CapsLock && wParam == (IntPtr)(int)KMMessages.WM_KEYUP) {
          \t\t\t\tself = true;
          \t\t\t\tChangeLayout();
          \t\t\t\tself = false;
          \t\t\t}''',
          '''\t\t\tif(!self && !shift && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "CapsLock" &&
          \t\t\t\tKey == Keys.CapsLock && wParam == (IntPtr)(int)KMMessages.WM_KEYUP) {
          \t\t\t\tif(queuedOperation == null)
          \t\t\t\t\tqueuedOperation = ChangeLayout;
          \t\t\t}''',
          'CapsLock queue')

          replace_once(
          '''\t\t\tif(!self && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "Left Control" &&
          \t\t\t\tKey == Keys.LControlKey && wParam == (IntPtr)(int)KMMessages.WM_KEYUP &&
          \t\t\t\t!MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls")) {
          \t\t\t\tself = true;
          \t\t\t\tif(MMain.MyConfs.ReadBool("Functions", "EmulateLayoutSwitch")) {
          \t\t\t\t\tKeybdEvent(Keys.LControlKey, 2); // Sends it up to make it work when using "EmulateLayoutSwitch" 
          \t\t\t\t}
          \t\t\t\tChangeLayout();
          \t\t\t\tKeybdEvent(Keys.LControlKey, 2); //fix for PostMessage, it somehow o_0 sends another ctrl...

          \t\t\t\tself = false;
          \t\t\t}''',
          '''\t\t\tif(!self && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "Left Control" &&
          \t\t\t\tKey == Keys.LControlKey && wParam == (IntPtr)(int)KMMessages.WM_KEYUP &&
          \t\t\t\t!MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls")) {
          \t\t\t\tbool emulateSwitch = MMain.MyConfs.ReadBool("Functions", "EmulateLayoutSwitch");
          \t\t\t\tif(queuedOperation == null) {
          \t\t\t\t\tqueuedOperation = delegate {
          \t\t\t\t\t\tif(emulateSwitch)
          \t\t\t\t\t\t\tKeybdEvent(Keys.LControlKey, 2);
          \t\t\t\t\t\tChangeLayout();
          \t\t\t\t\t\tKeybdEvent(Keys.LControlKey, 2);
          \t\t\t\t\t};
          \t\t\t\t}
          \t\t\t}''',
          'Left Control queue')

          replace_once(
          '''\t\t\tif(!self && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "Right Control" &&
          \t\t\t\tKey == Keys.RControlKey && wParam == (IntPtr)(int)KMMessages.WM_KEYUP &&
          \t\t\t\t!MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls")) {
          \t\t\t\tself = true;
          \t\t\t\tif(MMain.MyConfs.ReadBool("Functions", "EmulateLayoutSwitch")) {
          \t\t\t\t\tKeybdEvent(Keys.RControlKey, 2); // Sends it up to make it work when using "EmulateLayoutSwitch" 
          \t\t\t\t}
          \t\t\t\tChangeLayout();
          \t\t\t\tself = false;
          \t\t\t}''',
          '''\t\t\tif(!self && MMain.MyConfs.Read("HotKeys", "OnlyKeyLayoutSwicth") == "Right Control" &&
          \t\t\t\tKey == Keys.RControlKey && wParam == (IntPtr)(int)KMMessages.WM_KEYUP &&
          \t\t\t\t!MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls")) {
          \t\t\t\tbool emulateSwitch = MMain.MyConfs.ReadBool("Functions", "EmulateLayoutSwitch");
          \t\t\t\tif(queuedOperation == null) {
          \t\t\t\t\tqueuedOperation = delegate {
          \t\t\t\t\t\tif(emulateSwitch)
          \t\t\t\t\t\t\tKeybdEvent(Keys.RControlKey, 2);
          \t\t\t\t\t\tChangeLayout();
          \t\t\t\t\t};
          \t\t\t\t}
          \t\t\t}''',
          'Right Control queue')

          replace_once(
          '''\t\t\tif(!self && MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls") && wParam == (IntPtr)(int)KMMessages.WM_KEYUP && !keyAfterCTRL) {
          \t\t\t\tif(Key == Keys.RControlKey) {
          \t\t\t\t\tPostMessage(Locales.ActiveWindow(), KInputs.WM_INPUTLANGCHANGEREQUEST, 0, (uint)MMain.MyConfs.ReadInt("ExtCtrls", "RCLocale"));
          \t\t\t\t}
          \t\t\t\tif(Key == Keys.LControlKey) {
          \t\t\t\t\tPostMessage(Locales.ActiveWindow(), KInputs.WM_INPUTLANGCHANGEREQUEST, 0, (uint)MMain.MyConfs.ReadInt("ExtCtrls", "LCLocale"));
          \t\t\t\t}
          \t\t\t}''',
          '''\t\t\tif(!self && MMain.MyConfs.ReadBool("ExtCtrls", "UseExtCtrls") && wParam == (IntPtr)(int)KMMessages.WM_KEYUP && !keyAfterCTRL) {
          \t\t\t\tuint targetLocale = 0;
          \t\t\t\tif(Key == Keys.RControlKey)
          \t\t\t\t\ttargetLocale = (uint)MMain.MyConfs.ReadInt("ExtCtrls", "RCLocale");
          \t\t\t\tif(Key == Keys.LControlKey)
          \t\t\t\t\ttargetLocale = (uint)MMain.MyConfs.ReadInt("ExtCtrls", "LCLocale");
          \t\t\t\tif(targetLocale != 0 && queuedOperation == null) {
          \t\t\t\t\tuint requestedLocale = targetLocale;
          \t\t\t\t\tqueuedOperation = () => ChangeLayoutTo(requestedLocale);
          \t\t\t\t}
          \t\t\t}''',
          'extended Control target queue')

          replace_once(
          '''\t\tstatic void ChangeLayout() //Changes current layout
          \t\t{''',
          '''\t\tstatic void ChangeLayoutTo(uint targetLocale)
          \t\t{
          \t\t\tif(targetLocale == 0 || Locales.GetCurrentLocale() == targetLocale)
          \t\t\t\treturn;

          \t\t\tIntPtr activeWindow = Locales.ActiveWindow();
          \t\t\tfor(int tries = 0; tries < 3 && Locales.GetCurrentLocale() != targetLocale; tries++) {
          \t\t\t\tPostMessage(activeWindow, KInputs.WM_INPUTLANGCHANGEREQUEST, 0, targetLocale);
          \t\t\t\tThread.Sleep(50);
          \t\t\t}
          \t\t\tif(Locales.GetCurrentLocale() != targetLocale)
          \t\t\t\tlog.Warn("Could not switch to requested locale {0}", targetLocale);
          \t\t}

          \t\tstatic void ChangeLayout() //Changes current layout
          \t\t{''',
          'target layout helper')

          data = text.replace('\n', '\r\n').encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          path.write_bytes(data)
          '@ | Set-Content -Path patch_layout_switch.py -Encoding utf8
          python patch_layout_switch.py

      - name: Verify changes
        shell: pwsh
        run: |
          if (Select-String -Path Mahou/Classes/KMHook.cs -SimpleMatch 'self = true;' -Context 0,1 | Where-Object { $_.Context.PostContext -match 'ChangeLayout\(\)' }) {
            throw 'Synchronous self/ChangeLayout block still present'
          }
          Select-String -Path Mahou/Classes/KMHook.cs -SimpleMatch 'queuedOperation = ChangeLayout'
          Select-String -Path Mahou/Classes/KMHook.cs -SimpleMatch 'ChangeLayoutTo(requestedLocale)'

      - name: Commit patch and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-layout-switch-queue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mahou/Classes/KMHook.cs .github/workflows/apply-layout-switch-queue.yml
          git commit -m 'Queue one-key layout switching outside hook'
          git push origin HEAD:mixanizm-adaptive-layout-learning
