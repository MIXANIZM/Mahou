name: Security regression

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: security-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-smart-caps-r2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Verify and apply reviewed Smart Caps update
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/agz-mah-0001-r2.part00 \
            .github/patches/agz-mah-0001-r2.part01 \
            .github/patches/agz-mah-0001-r2.part02 \
            .github/patches/agz-mah-0001-r2.part03 \
            | base64 -d > /tmp/agz-mah-0001-r2.tar.gz
          printf '%s  %s\n' \
            'fab2835e867237bf56d0c1a008cf0ce85dbe7ca9f895ea4646fce6cafd431ba9' \
            '/tmp/agz-mah-0001-r2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/agz-mah-0001-r2.tar.gz
          rm -f .github/patches/agz-mah-0001-r2.part00
          rm -f .github/patches/agz-mah-0001-r2.part01
          rm -f .github/patches/agz-mah-0001-r2.part02
          rm -f .github/patches/agz-mah-0001-r2.part03
          git -c core.whitespace=cr-at-eol diff --check
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('Mahou/Classes/Languages.cs').read_text(encoding='utf-8-sig')
          enum_match = re.search(r'public enum Element\s*\{(.*?)\n\s*\}', text, re.S)
          if not enum_match:
              raise SystemExit('Languages.Element enum not found')
          enum_text = re.sub(r'#region.*|#endregion.*|//.*', '', enum_match.group(1))
          keys = set(re.findall(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*,', enum_text))
          expected = {'tab_SmartTyping', 'SmartCapsEnabled', 'SmartCapsDescription', 'SmartCapsExceptions', 'SmartCapsClear', 'SmartCapsStatus'}
          if not expected.issubset(keys):
              raise SystemExit('Smart typing language keys are incomplete')
          for language in ('English', 'Russian'):
              start = text.index('Dictionary<Element, string> ' + language)
              next_start = text.find('Dictionary<Element, string>', start + 1)
              block = text[start: next_start if next_start >= 0 else len(text)]
              entries = set(re.findall(r'Element\.([A-Za-z_][A-Za-z0-9_]*)\s*,', block))
              missing = sorted(keys - entries)
              extra = sorted(entries - keys)
              if missing or extra:
                  raise SystemExit('%s dictionary mismatch: missing=%r extra=%r' % (language, missing, extra))
              print('%s localization: %d/%d keys' % (language, len(entries), len(keys)))
          PY
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/patches/agz-mah-0001-r2.part00',
              '.github/patches/agz-mah-0001-r2.part01',
              '.github/patches/agz-mah-0001-r2.part02',
              '.github/patches/agz-mah-0001-r2.part03',
              '.github/scripts/security-regression.py',
              '.github/tests/SmartCapsRegression.cs',
              '.github/workflows/security-regression.yml',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'ISSUES.md',
              'KNOWN-LIMITATIONS.md',
              'Mahou/Classes/Languages.cs',
              'Mahou/Classes/SmartCaps.cs',
              'Mahou/MahouUI.SmartTyping.cs',
              'README-MIXANIZM.md',
              'TEST-PLAN-WINDOWS11.md',
              'TESTING.md',
              'UNIVERSAL-CHAT-HANDOFF.md',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected changed-file set: expected=%r actual=%r' % (sorted(expected), sorted(actual)))
          print('Changed-file set verified: %d files' % len(actual))
          PY

      - name: Commit product update and restore read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'AGZ-MAH-0001 fix: localize and expand Smart Caps'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
