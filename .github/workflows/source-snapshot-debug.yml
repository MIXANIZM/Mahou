name: Source snapshot debug

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-snapshot-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0
          show-progress: false

      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=MIXANIZM-Mahou-current-source.zip HEAD
          git rev-parse HEAD > SOURCE-COMMIT.txt
          sha256sum MIXANIZM-Mahou-current-source.zip > SOURCE-SHA256.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: MIXANIZM-Mahou-current-source
          path: |
            MIXANIZM-Mahou-current-source.zip
            SOURCE-COMMIT.txt
            SOURCE-SHA256.txt
          if-no-files-found: error
          retention-days: 3
