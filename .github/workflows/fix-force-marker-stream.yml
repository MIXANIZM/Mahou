name: Fix force marker stream

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-force-marker-stream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'mixanizm-modern-v2.9.0.1' || github.ref_name == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0
          show-progress: false

      - name: Dispose force marker stream
        shell: bash
        run: |
          set -o pipefail
          mkdir -p force-marker-diagnostics
          script=.github/scripts/fix-force-marker-stream.py
          if [ ! -f "$script" ]; then
            echo 'Force marker stream fix is already applied.' | tee force-marker-diagnostics/result.txt
            exit 0
          fi
          python3 "$script" 2>&1 | tee force-marker-diagnostics/result.txt
          python3 .github/scripts/security-regression.py 2>&1 | tee -a force-marker-diagnostics/result.txt
          git config core.whitespace cr-at-eol
          git diff --check 2>&1 | tee -a force-marker-diagnostics/result.txt
          rm -f .github/workflows/fix-force-marker-stream.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: dispose AppData force marker stream'
          git push origin HEAD:mixanizm-modern-v2.9.0.1

      - name: Upload force marker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: force-marker-diagnostics
          path: force-marker-diagnostics
          if-no-files-found: warn
          retention-days: 3
