name: AGZ-MAH-0019 source export

on:
  push:
    branches:
      - agz-mah-0019-remove-snippets-decouple-autoswitch

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pack source tree
        shell: bash
        run: |
          git archive --format=zip --output=agz-mah-0019-source.zip HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agz-mah-0019-source-${{ github.sha }}
          path: agz-mah-0019-source.zip
          if-no-files-found: error
          retention-days: 1
