name: Run Insert layout synchronization once

on:
  push:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write

concurrency:
  group: run-insert-layout-sync-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-insert-layout-sync-once.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          grep -Fq 'SwitchLayoutAfterManualConversion(convertedTargetLayout, "selection", conversionForeground);' Mahou/Classes/KMHook.cs
          grep -Fq 'SwitchLayoutAfterManualConversion(targetLayout, "standard-edit-caret-word", conversionForeground);' Mahou/Classes/KMHook.cs
          grep -Fq 'SwitchLayoutAfterManualConversion(targetLayout, "word-caret-range", conversionForeground);' Mahou/Classes/KMHook.cs

      - name: Commit and push code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mahou/Classes/KMHook.cs .github/scripts/security-regression.py
          git commit -m 'feat: synchronize layout after Insert conversion'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
