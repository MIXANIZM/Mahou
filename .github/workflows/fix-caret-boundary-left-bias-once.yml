name: Fix caret boundary left bias once

on:
  push:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write

concurrency:
  group: fix-caret-boundary-left-bias
  cancel-in-progress: false

jobs:
  fix:
    if: github.ref == 'refs/heads/mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Normalize and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          files = [
              Path('.github/scripts/security-regression.py'),
              Path('Mahou/Classes/SelectionProbe.cs'),
          ]
          bom = b'\xef\xbb\xbf'
          metadata = {}
          for path in files:
              raw = path.read_bytes()
              has_bom = raw.startswith(bom)
              if has_bom:
                  raw = raw[len(bom):]
              metadata[str(path)] = {'bom': has_bom, 'crlf': b'\r\n' in raw}
              path.write_bytes(raw.decode('utf-8').replace('\r\n', '\n').encode('utf-8'))
          Path('/tmp/caret-left-bias-meta.json').write_text(json.dumps(metadata), encoding='utf-8')
          PY

          git apply --check .github/patches/caret-boundary-left-bias.patch
          git apply .github/patches/caret-boundary-left-bias.patch

          python3 - <<'PY'
          from pathlib import Path
          import json

          bom = b'\xef\xbb\xbf'
          metadata = json.loads(Path('/tmp/caret-left-bias-meta.json').read_text(encoding='utf-8'))
          for name, meta in metadata.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              raw = (text.replace('\n', '\r\n') if meta['crlf'] else text).encode('utf-8')
              if meta['bom']:
                  raw = bom + raw
              path.write_bytes(raw)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var caretInsideWord = caretOnWord && leftOnWord;' Mahou/Classes/SelectionProbe.cs
          grep -Fq 'At an exact word-start boundary, prefer the previous word' Mahou/Classes/SelectionProbe.cs
          grep -Fq 'var caretOffset = Math.Max(0, -movedStart);' Mahou/Classes/SelectionProbe.cs
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/security-regression.py Mahou/Classes/SelectionProbe.cs
          git commit -m 'fix: prefer previous word at caret boundary'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
