name: Chrome extension editing core

on:
  pull_request:
    branches:
      - mixanizm-modern-v2.9.0.1
    paths:
      - '.github/scripts/chrome-extension-editing-core-regression.py'
      - '.github/tests/chrome-extension-editing-core.test.js'
      - '.github/workflows/chrome-extension-editing-core.yml'
      - 'integrations/chrome-smart-caps/prototype-extension/**'
      - 'docs/CHROME-SMART-CAPS-DIAGNOSTIC.html'
      - 'docs/CHROME-EXTENSION-EDITING-CORE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify manifest and source boundary
        run: python3 .github/scripts/chrome-extension-editing-core-regression.py

      - name: Verify editing-core safety contracts
        run: node .github/tests/chrome-extension-editing-core.test.js
