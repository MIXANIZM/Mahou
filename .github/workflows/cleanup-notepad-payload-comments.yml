name: Cleanup Notepad payload comments

on:
  pull_request:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  issues: write
  pull-requests: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace remaining transport comments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          list_request = urllib.request.Request(
              'https://api.github.com/repos/MIXANIZM/Mahou/issues/3/comments?per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(list_request, timeout=30) as response:
              comments = json.load(response)

          replacement = (
              'Временная транспортная часть AGZ-MAH-0003 удалена после создания '
              'чистой продуктовой ветки и проверки SHA-256. Payload больше не хранится '
              'в обсуждении.'
          )
          changed = 0
          for comment in comments:
              body = comment.get('body') or ''
              if not body.startswith('AGZ-MAH-0003-PAYLOAD-'):
                  continue
              data = json.dumps({'body': replacement}).encode('utf-8')
              request = urllib.request.Request(
                  comment['url'], data=data, headers=headers, method='PATCH'
              )
              with urllib.request.urlopen(request, timeout=30):
                  changed += 1
          print('Sanitized comments:', changed)
          PY
