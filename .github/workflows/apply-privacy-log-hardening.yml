name: Apply privacy log hardening

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-privacy-log-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'mixanizm-modern-v2.9.0.1' || github.ref_name == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0
          show-progress: false

      - name: Apply privacy-safe logging migration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p privacy-migration-diagnostics
          script=.github/scripts/apply-privacy-log-hardening.py
          if [ ! -f "$script" ]; then
            echo 'Privacy log hardening already applied.' | tee privacy-migration-diagnostics/result.txt
            exit 0
          fi
          python3 "$script" 2>&1 | tee privacy-migration-diagnostics/result.txt
          python3 .github/scripts/security-regression.py 2>&1 | tee -a privacy-migration-diagnostics/result.txt
          git diff --check 2>&1 | tee -a privacy-migration-diagnostics/result.txt
          rm -f .github/privacy-log-trigger.txt
          rm -f .github/workflows/apply-privacy-log-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: redact plaintext from diagnostic logs'
          git push origin HEAD:mixanizm-modern-v2.9.0.1

      - name: Upload privacy migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-migration-diagnostics
          path: privacy-migration-diagnostics
          if-no-files-found: warn
          retention-days: 3
