name: Apply invisible caret word patch once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-invisible-caret-word-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Assemble and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/caret-around.part01 \
            .github/patches/caret-around.part02 \
            .github/patches/caret-around.part03 \
            > /tmp/caret-around.patch

          python3 - <<'PY'
          from pathlib import Path
          import json

          files = [
              Path('.github/scripts/security-regression.py'),
              Path('Mahou/Classes/KMHook.cs'),
              Path('Mahou/Classes/SelectionProbe.cs'),
          ]
          bom = b'\xef\xbb\xbf'
          metadata = {}
          for path in files:
              raw = path.read_bytes()
              has_bom = raw.startswith(bom)
              if has_bom:
                  raw = raw[len(bom):]
              metadata[str(path)] = {
                  'bom': has_bom,
                  'crlf': b'\r\n' in raw,
              }
              text = raw.decode('utf-8').replace('\r\n', '\n')
              path.write_bytes(text.encode('utf-8'))
          Path('/tmp/caret-around-meta.json').write_text(json.dumps(metadata), encoding='utf-8')
          PY

          git apply --check /tmp/caret-around.patch
          git apply /tmp/caret-around.patch

          python3 - <<'PY'
          from pathlib import Path
          import json

          bom = b'\xef\xbb\xbf'
          metadata = json.loads(Path('/tmp/caret-around-meta.json').read_text(encoding='utf-8'))
          for name, meta in metadata.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              raw = (text.replace('\n', '\r\n') if meta['crlf'] else text).encode('utf-8')
              if meta['bom']:
                  raw = bom + raw
              path.write_bytes(raw)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          if git diff --unified=0 -- \
               .github/scripts/security-regression.py \
               Mahou/Classes/KMHook.cs \
               Mahou/Classes/SelectionProbe.cs \
             | grep -E '^\+[^+].*(<<<<<<<|=======|>>>>>>>)'; then
            echo 'Conflict marker introduced by caret-word patch.' >&2
            exit 1
          fi

      - name: Commit code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/security-regression.py \
            Mahou/Classes/KMHook.cs \
            Mahou/Classes/SelectionProbe.cs
          git commit -m 'feat: convert word around caret without visible selection'

      - name: Push code commit
        shell: bash
        run: git push origin HEAD:mixanizm-modern-v2.9.0.1
