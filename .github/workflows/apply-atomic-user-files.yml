name: Apply atomic user files

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-atomic-user-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'mixanizm-modern-v2.9.0.1' || github.ref_name == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0
          show-progress: false

      - name: Apply atomic user file writes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p atomic-user-files-diagnostics
          script=.github/scripts/apply-atomic-user-files.py
          if [ ! -f "$script" ]; then
            echo 'Atomic user file writes are already applied.' | tee atomic-user-files-diagnostics/result.txt
            exit 0
          fi
          python3 "$script" 2>&1 | tee atomic-user-files-diagnostics/result.txt
          python3 .github/scripts/security-regression.py 2>&1 | tee -a atomic-user-files-diagnostics/result.txt
          git config core.whitespace cr-at-eol
          git diff --check 2>&1 | tee -a atomic-user-files-diagnostics/result.txt
          rm -f .github/workflows/apply-atomic-user-files.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'reliability: atomically replace low-frequency user files'
          git push origin HEAD:mixanizm-modern-v2.9.0.1

      - name: Upload atomic file diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-user-files-diagnostics
          path: atomic-user-files-diagnostics
          if-no-files-found: warn
          retention-days: 3
