name: Normalize project file

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
    paths:
      - .github/workflows/normalize-csproj.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0

      - name: Normalize CRLF without blank-line inflation
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Mahou/Mahou.csproj')
          raw = path.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          if bom:
              raw = raw[3:]
          text = raw.decode('utf-8')
          text = text.replace('\r\r\n', '\n').replace('\r\n', '\n').replace('\r', '\n')
          while '\n\n\n' in text:
              text = text.replace('\n\n\n', '\n\n')
          data = text.replace('\n', '\r\n').encode('utf-8')
          if bom:
              data = b'\xef\bb\bf' + data
          path.write_bytes(data)
          '@ | Set-Content -Path normalize_project.py -Encoding utf8
          python normalize_project.py
          Remove-Item normalize_project.py

      - name: Commit normalization and remove workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/normalize-csproj.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mahou/Mahou.csproj .github/workflows/normalize-csproj.yml
          git diff --cached --check
          git commit -m "Normalize project file after DPI wiring"
          git push origin HEAD:mixanizm-adaptive-layout-learning
