name: Apply AGZ-MAH-0001 Smart Caps once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-agz-mah-0001-smart-caps-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Decode reviewed patch and normalize target files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/agz-mah-0001-smart-caps.part00 \
            .github/patches/agz-mah-0001-smart-caps.part01 \
            .github/patches/agz-mah-0001-smart-caps.part02 \
            .github/patches/agz-mah-0001-smart-caps.part03 \
            .github/patches/agz-mah-0001-smart-caps.part04 \
            | base64 -d > /tmp/agz-mah-0001-smart-caps.patch.gz
          gzip -t /tmp/agz-mah-0001-smart-caps.patch.gz
          gzip -dc /tmp/agz-mah-0001-smart-caps.patch.gz > /tmp/agz-mah-0001-smart-caps.patch.crlf
          python3 - <<'PY'
          from pathlib import Path
          import json

          patch_source = Path('/tmp/agz-mah-0001-smart-caps.patch.crlf').read_bytes()
          Path('/tmp/agz-mah-0001-smart-caps.patch').write_bytes(patch_source.replace(b'\r\n', b'\n'))

          names = [
              'Mahou/Classes/Configs.cs',
              'Mahou/Classes/SelectionProbe.cs',
              'Mahou/MahouUI.cs',
          ]
          bom = b'\xef\xbb\xbf'
          meta = {}
          for name in names:
              path = Path(name)
              raw = path.read_bytes()
              has_bom = raw.startswith(bom)
              if has_bom:
                  raw = raw[len(bom):]
              meta[name] = {'bom': has_bom, 'crlf': b'\r\n' in raw}
              path.write_bytes(raw.replace(b'\r\n', b'\n'))
          Path('/tmp/agz-mah-0001-line-meta.json').write_text(json.dumps(meta), encoding='utf-8')
          PY
          sha256sum /tmp/agz-mah-0001-smart-caps.patch

      - name: Validate reviewed patch
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          patch --fuzz=2 -p1 --dry-run < /tmp/agz-mah-0001-smart-caps.patch > /tmp/agz-mah-0001-apply.log 2>&1

      - name: Persist validation diagnostic
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/agz-mah-0001-apply.log .github/patches/agz-mah-0001-apply-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/patches/agz-mah-0001-apply-diagnostic.txt
          git commit -m 'chore: record AGZ-MAH-0001 apply diagnostic'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
          exit 1

      - name: Apply reviewed patch and restore file format
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          patch --fuzz=2 -p1 < /tmp/agz-mah-0001-smart-caps.patch
          python3 - <<'PY'
          from pathlib import Path
          import json

          bom = b'\xef\xbb\xbf'
          meta = json.loads(Path('/tmp/agz-mah-0001-line-meta.json').read_text(encoding='utf-8'))
          for name, info in meta.items():
              path = Path(name)
              raw = path.read_bytes()
              if raw.startswith(bom):
                  raw = raw[len(bom):]
              if info['crlf']:
                  raw = raw.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
              if info['bom']:
                  raw = bom + raw
              path.write_bytes(raw)
          PY
          git -c core.whitespace=cr-at-eol diff --check

      - name: Run fast regression gates
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          grep -Fq 'CheckBool("SmartTyping", "SmartCapsEnabled", "false")' Mahou/Classes/Configs.cs
          grep -Fq 'HasSingleSupportedScript' Mahou/Classes/SmartCaps.cs
          grep -Fq 'TryReplaceActiveFreshTextBeforeCaret' Mahou/Classes/SelectionProbe.cs
          grep -Fq 'SmartCapsRegression.exe' .github/workflows/modern-windows-build.yml
          ! grep -Eq 'KInputs\.|GetClipStr\(|PasteText\(|NativeClipboard|\.Select\(\)' Mahou/Classes/SmartCaps.cs

      - name: Commit product and documentation changes
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agz-mah-0001-smart-caps.patch.gz.b64
          rm -f .github/patches/agz-mah-0001-smart-caps.part00
          rm -f .github/patches/agz-mah-0001-smart-caps.part01
          rm -f .github/patches/agz-mah-0001-smart-caps.part02
          rm -f .github/patches/agz-mah-0001-smart-caps.part03
          rm -f .github/patches/agz-mah-0001-smart-caps.part04
          rm -f .github/workflows/apply-agz-mah-0001-smart-caps-once.yml
          rm -f .github/patches/agz-mah-0001-trigger.txt
          rm -f .github/patches/agz-mah-0001-apply-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'AGZ-MAH-0001 feat: add safe opt-in Smart Caps'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
