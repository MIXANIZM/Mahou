name: Apply AGZ-MAH-0001 Smart Caps once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-agz-mah-0001-smart-caps-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Decode reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/agz-mah-0001-smart-caps.part00 \
            .github/patches/agz-mah-0001-smart-caps.part01 \
            .github/patches/agz-mah-0001-smart-caps.part02 \
            .github/patches/agz-mah-0001-smart-caps.part03 \
            .github/patches/agz-mah-0001-smart-caps.part04 \
            | base64 -d > /tmp/agz-mah-0001-smart-caps.patch.gz
          gzip -t /tmp/agz-mah-0001-smart-caps.patch.gz
          gzip -dc /tmp/agz-mah-0001-smart-caps.patch.gz > /tmp/agz-mah-0001-smart-caps.patch.crlf
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/agz-mah-0001-smart-caps.patch.crlf').read_bytes()
          Path('/tmp/agz-mah-0001-smart-caps.patch').write_bytes(source.replace(b'\r\n', b'\n'))
          PY
          sha256sum /tmp/agz-mah-0001-smart-caps.patch

      - name: Validate reviewed patch
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          patch --fuzz=2 -p1 --dry-run < /tmp/agz-mah-0001-smart-caps.patch > /tmp/agz-mah-0001-apply.log 2>&1

      - name: Persist validation diagnostic
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/agz-mah-0001-apply.log .github/patches/agz-mah-0001-apply-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/patches/agz-mah-0001-apply-diagnostic.txt
          git commit -m 'chore: record AGZ-MAH-0001 apply diagnostic'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
          exit 1

      - name: Apply reviewed patch
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          patch --fuzz=2 -p1 < /tmp/agz-mah-0001-smart-caps.patch
          git diff --check

      - name: Run fast regression gates
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          grep -Fq 'CheckBool("SmartTyping", "SmartCapsEnabled", "false")' Mahou/Classes/Configs.cs
          grep -Fq 'HasSingleSupportedScript' Mahou/Classes/SmartCaps.cs
          grep -Fq 'TryReplaceActiveFreshTextBeforeCaret' Mahou/Classes/SelectionProbe.cs
          grep -Fq 'SmartCapsRegression.exe' .github/workflows/modern-windows-build.yml
          ! grep -Eq 'KInputs\.|GetClipStr\(|PasteText\(|NativeClipboard|\.Select\(\)' Mahou/Classes/SmartCaps.cs

      - name: Commit product and documentation changes
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/agz-mah-0001-smart-caps.patch.gz.b64
          git rm .github/patches/agz-mah-0001-smart-caps.part00
          git rm .github/patches/agz-mah-0001-smart-caps.part01
          git rm .github/patches/agz-mah-0001-smart-caps.part02
          git rm .github/patches/agz-mah-0001-smart-caps.part03
          git rm .github/patches/agz-mah-0001-smart-caps.part04
          git rm .github/workflows/apply-agz-mah-0001-smart-caps-once.yml
          rm -f .github/patches/agz-mah-0001-trigger.txt
          rm -f .github/patches/agz-mah-0001-apply-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'AGZ-MAH-0001 feat: add safe opt-in Smart Caps'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
