name: Apply ordered input queue patch

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
    paths:
      - .github/workflows/apply-input-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          ROOT = Path('.')

          def read_source(path):
              raw = Path(path).read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              if bom:
                  raw = raw[3:]
              text = raw.decode('utf-8').replace('\r\n', '\n')
              return text, bom

          def write_source(path, text, bom=True):
              data = text.replace('\r\n', '\n').replace('\n', '\r\n').encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              Path(path).write_bytes(data)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          km_path = ROOT / 'Mahou/Classes/KMHook.cs'
          km, km_bom = read_source(km_path)

          km = replace_once(
              km,
              '\t\tpublic static bool self, win, alt, ctrl, shift,\n\t\t\tshiftRP, ctrlRP, altRP, //RP = Re-Press',
              '\t\tpublic static volatile bool self;\n\t\tpublic static bool win, alt, ctrl, shift,\n\t\t\tshiftRP, ctrlRP, altRP, //RP = Re-Press',
              'make self volatile')

          km = replace_once(
              km,
              '\t\tpublic static IntPtr HookCallback(int nCode, IntPtr wParam, IntPtr lParam) {\n\t\t\tint vkCode = Marshal.ReadInt32(lParam);\n\t\t\tvar Key = (Keys)vkCode; // "Key" will further be used instead of "(Keys)vkCode"',
              '\t\tpublic static IntPtr HookCallback(int nCode, IntPtr wParam, IntPtr lParam) {\n\t\t\tif(nCode < 0)\n\t\t\t\treturn CallNextHookEx(MMain._hookID, nCode, wParam, lParam);\n\n\t\t\tint vkCode = Marshal.ReadInt32(lParam);\n\t\t\tvar Key = (Keys)vkCode; // "Key" will further be used instead of "(Keys)vkCode"\n\t\t\tif(!self && InputOperationQueue.TryCaptureKey(Key, wParam))\n\t\t\t\treturn (IntPtr)1;\n\t\t\tbool suppressCurrentEvent = false;',
              'hook preamble')

          km = replace_once(
              km,
              '\t\t\t\t\tvar t = new Task(new Action(() => ConvertLast(words)));\n\t\t\t\t\tt.RunSynchronously();',
              '\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(words));',
              'multiple words queue')

          km = replace_once(
              km,
              '\t\t\t\t\t\t\t\tvar t = new Task(ConvertSelection);\n\t\t\t\t\t\t\t\tt.RunSynchronously();',
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(ConvertSelection);',
              'selection queue')

          km = replace_once(
              km,
              '\t\t\t\t\t\t\t\tAdaptiveLayoutLearning.RecordManualCorrection(new List<YuKey>(MMain.c_word));\n\t\t\t\t\t\t\t\tvar t = new Task(new Action(() => ConvertLast(MMain.c_word)));\n\t\t\t\t\t\t\t\tt.RunSynchronously();',
              '\t\t\t\t\t\t\t\tvar word = new List<YuKey>(MMain.c_word);\n\t\t\t\t\t\t\t\tAdaptiveLayoutLearning.RecordManualCorrection(word);\n\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(word));',
              'last word queue')

          km = replace_once(
              km,
              '\t\t\t\t\t\t\t\tvar t = new Task(new Action(() => ConvertLast(line)));\n\t\t\t\t\t\t\t\tt.RunSynchronously();',
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(line));',
              'line queue')

          old_snippet = '''\t\t\t\t\t\t\tif(snip == snipps[i]) {\n\t\t\t\t\t\t\t\t//\t\t\t\t\t\tConsole.WriteLine("ITISEQ!");\n\t\t\t\t\t\t\t\t//\t\t\t\t\t\t\tConsole.WriteLine(c_snip.Count);\n\t\t\t\t\t\t\t\tself = true;\n\t\t\t\t\t\t\t\tfor(int e = -1; e < c_snip.Count; e++) {\n\t\t\t\t\t\t\t\t\tKInputs.MakeInput(new[] { KInputs.AddKey(Keys.Back, true),\n\t\t\t\t\t\t\t\t\tKInputs.AddKey(Keys.Back, false)\n\t\t\t\t\t\t\t\t});\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t//\t\t\t\t\t\t\tConsole.WriteLine(exps[0]);\n\t\t\t\t\t\t\t\t//\t\t\t\t\t\t\tConsole.WriteLine(snipps.Length);\n\t\t\t\t\t\t\t\t//\t\t\t\t\t\t\tConsole.WriteLine(exps.Length);\n\t\t\t\t\t\t\t\ttry {\n\t\t\t\t\t\t\t\t\tKInputs.MakeInput(KInputs.AddString(exps[i]));\n\t\t\t\t\t\t\t\t} catch {\n\t\t\t\t\t\t\t\t\t// If not use TASK, form won't accept the keys(Enter/Escape/Alt+F4).\n\t\t\t\t\t\t\t\t\tvar tsk = new Task(() => MessageBox.Show(MMain.Msgs[10], MMain.Msgs[11], MessageBoxButtons.OK, MessageBoxIcon.Error));\n\t\t\t\t\t\t\t\t\ttsk.Start();\n\t\t\t\t\t\t\t\t\tKInputs.MakeInput(KInputs.AddString(snip));\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\tself = false;\n\t\t\t\t\t\t\t}'''
          new_snippet = '''\t\t\t\t\t\t\tif(snip == snipps[i]) {\n\t\t\t\t\t\t\t\tstring originalSnippet = snip;\n\t\t\t\t\t\t\t\tstring replacement = exps[i];\n\t\t\t\t\t\t\t\tint removeCount = c_snip.Count + 1;\n\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ExpandSnippet(originalSnippet, replacement, removeCount));\n\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t}'''
          km = replace_once(km, old_snippet, new_snippet, 'snippet queue')

          km = replace_once(
              km,
              '\t\t\t\t\t\tif(Key == Keys.Enter && AdaptiveLayoutLearning.ShouldAutoConvert(MMain.c_word))\n\t\t\t\t\t\t\tConvertLast(MMain.c_word);',
              '\t\t\t\t\t\tif(Key == Keys.Enter && AdaptiveLayoutLearning.ShouldAutoConvert(MMain.c_word)) {\n\t\t\t\t\t\t\tvar autoWord = new List<YuKey>(MMain.c_word);\n\t\t\t\t\t\t\tInputOperationQueue.EnqueueBoundary(() => ConvertLast(autoWord), Keys.Enter);\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;\n\t\t\t\t\t\t}',
              'enter auto queue')

          km = replace_once(
              km,
              '\t\t\t\t\t\tif(AdaptiveLayoutLearning.ShouldAutoConvert(MMain.c_word))\n\t\t\t\t\t\t\tConvertLast(MMain.c_word);',
              '\t\t\t\t\t\tif(AdaptiveLayoutLearning.ShouldAutoConvert(MMain.c_word)) {\n\t\t\t\t\t\t\tvar autoWord = new List<YuKey>(MMain.c_word);\n\t\t\t\t\t\t\tInputOperationQueue.EnqueueBoundary(() => ConvertLast(autoWord), Keys.Space);\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;\n\t\t\t\t\t\t\tif(MMain.MyConfs.ReadBool("Functions", "Snippets"))\n\t\t\t\t\t\t\t\tc_snip.Clear();\n\t\t\t\t\t\t}',
              'space auto queue')

          km = replace_once(
              km,
              '\t\t\treturn CallNextHookEx(MMain._hookID, nCode, wParam, lParam);\n\t\t}\n\t\tpublic static IntPtr MouseHookCallback',
              '\t\t\tif(suppressCurrentEvent)\n\t\t\t\treturn (IntPtr)1;\n\t\t\treturn CallNextHookEx(MMain._hookID, nCode, wParam, lParam);\n\t\t}\n\t\tpublic static IntPtr MouseHookCallback',
              'suppress queued boundary')

          expand_method = '''\t\tstatic void ExpandSnippet(string originalSnippet, string replacement, int removeCount)\n\t\t{\n\t\t\tfor(int i = 0; i < removeCount; i++) {\n\t\t\t\tKInputs.MakeInput(new[] {\n\t\t\t\t\tKInputs.AddKey(Keys.Back, true),\n\t\t\t\t\tKInputs.AddKey(Keys.Back, false)\n\t\t\t\t});\n\t\t\t}\n\n\t\t\ttry {\n\t\t\t\tKInputs.MakeInput(KInputs.AddString(replacement));\n\t\t\t} catch(Exception ex) {\n\t\t\t\tlog.Error(ex, "Cannot expand snippet");\n\t\t\t\tThreadPool.QueueUserWorkItem(delegate {\n\t\t\t\t\tMessageBox.Show(MMain.Msgs[10], MMain.Msgs[11], MessageBoxButtons.OK, MessageBoxIcon.Error);\n\t\t\t\t});\n\t\t\t\tKInputs.MakeInput(KInputs.AddString(originalSnippet));\n\t\t\t}\n\t\t}\n'''
          km = replace_once(
              km,
              '\t\tstatic void ConvertSelection() //Converts selected text',
              expand_method + '\t\tstatic void ConvertSelection() //Converts selected text',
              'snippet helper')

          write_source(km_path, km, km_bom)

          helper = r'''using System;
          using System.Collections.Generic;
          using System.Threading;
          using System.Windows.Forms;
          using NLog;

          namespace Mahou
          {
              internal static class InputOperationQueue
              {
                  private static readonly Logger Log = LogManager.GetCurrentClassLogger();
                  private static readonly object Sync = new object();
                  private static readonly Queue<WorkItem> Work = new Queue<WorkItem>();
                  private static readonly Queue<BufferedKey> BufferedKeys = new Queue<BufferedKey>();
                  private static readonly AutoResetEvent Signal = new AutoResetEvent(false);

                  private static Thread worker;
                  private static bool stopping;
                  private static bool capturing;
                  private static Keys? swallowPhysicalKeyUp;

                  internal static void Start()
                  {
                      lock (Sync)
                      {
                          if (worker != null)
                              return;

                          stopping = false;
                          worker = new Thread(WorkerLoop)
                          {
                              IsBackground = true,
                              Name = "MIXANIZM Mahou input worker"
                          };
                          worker.SetApartmentState(ApartmentState.STA);
                          worker.Start();
                      }
                  }

                  internal static void Stop()
                  {
                      Thread thread;
                      lock (Sync)
                      {
                          stopping = true;
                          thread = worker;
                      }

                      Signal.Set();
                      if (thread != null && thread != Thread.CurrentThread)
                          thread.Join(2000);

                      lock (Sync)
                      {
                          worker = null;
                          capturing = false;
                          Work.Clear();
                          BufferedKeys.Clear();
                          swallowPhysicalKeyUp = null;
                      }
                  }

                  internal static void Enqueue(Action action)
                  {
                      EnqueueInternal(action, null);
                  }

                  internal static void EnqueueBoundary(Action action, Keys boundaryKey)
                  {
                      EnqueueInternal(action, boundaryKey);
                  }

                  internal static bool TryCaptureKey(Keys key, IntPtr message)
                  {
                      bool isDown = message == (IntPtr)(int)KMHook.KMMessages.WM_KEYDOWN ||
                          message == (IntPtr)(int)KMHook.KMMessages.WM_SYSKEYDOWN;
                      bool isUp = message == (IntPtr)(int)KMHook.KMMessages.WM_KEYUP ||
                          message == (IntPtr)(int)KMHook.KMMessages.WM_SYSKEYUP;

                      if (!isDown && !isUp)
                          return false;

                      lock (Sync)
                      {
                          if (isUp && swallowPhysicalKeyUp.HasValue && swallowPhysicalKeyUp.Value == key)
                          {
                              swallowPhysicalKeyUp = null;
                              return true;
                          }

                          if (!capturing)
                              return false;

                          BufferedKeys.Enqueue(new BufferedKey(key, isDown));
                          return true;
                      }
                  }

                  private static void EnqueueInternal(Action action, Keys? boundaryKey)
                  {
                      if (action == null)
                          return;

                      Start();
                      lock (Sync)
                      {
                          if (stopping)
                              return;

                          capturing = true;
                          if (boundaryKey.HasValue)
                              swallowPhysicalKeyUp = boundaryKey;
                          Work.Enqueue(new WorkItem(action, boundaryKey));
                      }
                      Signal.Set();
                  }

                  private static void WorkerLoop()
                  {
                      while (true)
                      {
                          Signal.WaitOne();

                          while (true)
                          {
                              WorkItem item;
                              lock (Sync)
                              {
                                  if (Work.Count == 0)
                                  {
                                      if (stopping)
                                      {
                                          ReplayBufferedKeys();
                                          return;
                                      }
                                      break;
                                  }
                                  item = Work.Dequeue();
                              }

                              RunAction(item.Action);
                              if (item.BoundaryKey.HasValue)
                                  ReplayKeyPair(item.BoundaryKey.Value);

                              bool moreWork;
                              lock (Sync)
                                  moreWork = Work.Count != 0;
                              if (!moreWork)
                                  ReplayBufferedKeys();
                          }
                      }
                  }

                  private static void RunAction(Action action)
                  {
                      bool previousSelf = KMHook.self;
                      KMHook.self = true;
                      try
                      {
                          action();
                      }
                      catch (Exception ex)
                      {
                          Log.Error(ex, "Queued input operation failed");
                      }
                      finally
                      {
                          KMHook.self = previousSelf;
                      }
                  }

                  private static void ReplayKeyPair(Keys key)
                  {
                      bool previousSelf = KMHook.self;
                      KMHook.self = true;
                      try
                      {
                          KInputs.MakeInput(new[]
                          {
                              KInputs.AddKey(key, true),
                              KInputs.AddKey(key, false)
                          });
                      }
                      finally
                      {
                          KMHook.self = previousSelf;
                      }
                  }

                  private static void ReplayBufferedKeys()
                  {
                      while (true)
                      {
                          BufferedKey[] batch;
                          lock (Sync)
                          {
                              if (BufferedKeys.Count == 0)
                              {
                                  capturing = false;
                                  return;
                              }

                              batch = BufferedKeys.ToArray();
                              BufferedKeys.Clear();
                          }

                          bool previousSelf = KMHook.self;
                          KMHook.self = true;
                          try
                          {
                              var inputs = new KInputs.INPUT[batch.Length];
                              for (int i = 0; i < batch.Length; i++)
                                  inputs[i] = KInputs.AddKey(batch[i].Key, batch[i].Down);
                              KInputs.MakeInput(inputs);
                          }
                          finally
                          {
                              KMHook.self = previousSelf;
                          }
                      }
                  }

                  private sealed class WorkItem
                  {
                      internal readonly Action Action;
                      internal readonly Keys? BoundaryKey;

                      internal WorkItem(Action action, Keys? boundaryKey)
                      {
                          Action = action;
                          BoundaryKey = boundaryKey;
                      }
                  }

                  private struct BufferedKey
                  {
                      internal readonly Keys Key;
                      internal readonly bool Down;

                      internal BufferedKey(Keys key, bool down)
                      {
                          Key = key;
                          Down = down;
                      }
                  }
              }
          }
          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          write_source(ROOT / 'Mahou/Classes/InputOperationQueue.cs', helper, True)

          program_path = ROOT / 'Mahou/Program.cs'
          program, program_bom = read_source(program_path)
          program = replace_once(
              program,
              '                AdaptiveLayoutLearning.Start();',
              '                InputOperationQueue.Start();\n                AdaptiveLayoutLearning.Start();',
              'start input queue')
          program = replace_once(
              program,
              '                    AdaptiveLayoutLearning.Stop();\n                    StopHook();',
              '                    AdaptiveLayoutLearning.Stop();\n                    InputOperationQueue.Stop();\n                    StopHook();',
              'stop input queue')
          write_source(program_path, program, program_bom)

          project_path = ROOT / 'Mahou/Mahou.csproj'
          project, project_bom = read_source(project_path)
          project = replace_once(
              project,
              '    <Compile Include="Classes\\KMHook.cs" />',
              '    <Compile Include="Classes\\KMHook.cs" />\n    <Compile Include="Classes\\InputOperationQueue.cs" />',
              'project queue include')
          write_source(project_path, project, project_bom)

          workflow = ROOT / '.github/workflows/apply-input-queue.yml'
          workflow.unlink()
          '@ | Set-Content -Path apply_patch.py -Encoding utf8
          python apply_patch.py
          Remove-Item apply_patch.py

      - name: Commit guarded patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move input conversions to ordered worker queue"
          git push origin HEAD:mixanizm-adaptive-layout-learning
