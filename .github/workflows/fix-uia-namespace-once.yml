name: Fix UI Automation namespace once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: fix-uia-namespace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Add UI Automation text namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Mahou/Classes/SelectionProbe.cs')
          raw = path.read_bytes()
          bom = b'\xef\xbb\xbf'
          has_bom = raw.startswith(bom)
          if has_bom:
              raw = raw[len(bom):]
          crlf = b'\r\n' in raw
          text = raw.decode('utf-8').replace('\r\n', '\n')
          anchor = 'using System.Windows.Automation;\n'
          addition = 'using System.Windows.Automation.Text;\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Expected exactly one UI Automation using anchor.')
              text = text.replace(anchor, anchor + addition, 1)
          encoded = (text.replace('\n', '\r\n') if crlf else text).encode('utf-8')
          if has_bom:
              encoded = bom + encoded
          path.write_bytes(encoded)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'using System.Windows.Automation.Text;' Mahou/Classes/SelectionProbe.cs
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mahou/Classes/SelectionProbe.cs
          git commit -m 'fix: import UI Automation text enums'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
