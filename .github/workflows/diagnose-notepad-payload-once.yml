name: Diagnose Notepad payload once

on:
  pull_request:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agz-mah-0003-notepad-direct-adapter
          fetch-depth: 0
          show-progress: false

      - name: Record payload metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          repo_paths = [Path('.github/patches/agz-mah-0003.part%02d' % i) for i in range(5)]
          markers = [
              'AGZ-MAH-0003-PAYLOAD-05-06',
              'AGZ-MAH-0003-PAYLOAD-07-08',
              'AGZ-MAH-0003-PAYLOAD-09-10',
              'AGZ-MAH-0003-PAYLOAD-11-12',
          ]
          request = urllib.request.Request(
              'https://api.github.com/repos/MIXANIZM/Mahou/issues/3/comments?per_page=100',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comments = json.load(response)

          comment_parts = {}
          duplicate_counts = {marker: 0 for marker in markers}
          for comment in comments:
              body = comment.get('body') or ''
              for marker in markers:
                  prefix = marker + '\n'
                  if body.startswith(prefix):
                      duplicate_counts[marker] += 1
                      comment_parts[marker] = ''.join(body[len(prefix):].split())

          chunks = []
          parts = []
          for path in repo_paths:
              value = ''.join(path.read_text(encoding='utf-8').split()) if path.is_file() else ''
              chunks.append(value)
              parts.append({
                  'name': str(path),
                  'present': path.is_file(),
                  'characters': len(value),
                  'sha256_text': hashlib.sha256(value.encode('ascii')).hexdigest() if value else None,
              })
          for marker in markers:
              value = comment_parts.get(marker, '')
              chunks.append(value)
              parts.append({
                  'name': marker,
                  'count': duplicate_counts[marker],
                  'characters': len(value),
                  'sha256_text': hashlib.sha256(value.encode('ascii')).hexdigest() if value else None,
              })

          payload = ''.join(chunks)
          result = {
              'parts': parts,
              'total_base64_characters': len(payload),
              'expected_total_base64_characters': 100840,
          }
          try:
              raw = base64.b64decode(payload, validate=True)
              result['decoded_bytes'] = len(raw)
              result['decoded_sha256'] = hashlib.sha256(raw).hexdigest()
          except Exception as exc:
              result['decode_error'] = type(exc).__name__ + ': ' + str(exc)

          Path('.github/patches/agz-mah-0003-diagnostic.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit diagnostic metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/patches/agz-mah-0003-diagnostic.json
          git commit -m 'chore: record Notepad payload diagnostics'
          git push origin HEAD:agz-mah-0003-notepad-direct-adapter
