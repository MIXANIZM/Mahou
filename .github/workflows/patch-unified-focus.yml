name: Patch unified hotkey focus

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch focus detection
        shell: pwsh
        run: |
          $path = 'Mahou/Classes/KMHook.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = 'bool unifiedWordSelectionHotkey = !MMain.mahou.Focused && !self &&'
          $new = 'bool unifiedWordSelectionHotkey = !MMain.mahou.ContainsFocus && !MMain.mahou.moreConfigs.ContainsFocus && !self &&'
          if (($text.Split($old).Length - 1) -ne 1) { throw 'Unified focus marker count is not one.' }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($true))

      - name: Remove patch workflow and commit
        shell: pwsh
        run: |
          Remove-Item .github/workflows/patch-unified-focus.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mahou/Classes/KMHook.cs .github/workflows/patch-unified-focus.yml
          git commit -m "Allow editing the unified conversion hotkey"
          git push origin HEAD:mixanizm-adaptive-layout-learning
