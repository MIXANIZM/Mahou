name: Defer input queue dispatch patch

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
    paths:
      - .github/workflows/defer-input-queue-dispatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning
          fetch-depth: 0

      - name: Apply guarded callback dispatch patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Mahou/Classes/KMHook.cs')
          raw = path.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          if bom:
              raw = raw[3:]
          text = raw.decode('utf-8').replace('\r\n', '\n')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '\t\t\tbool suppressCurrentEvent = false;',
              '\t\t\tbool suppressCurrentEvent = false;\n\t\t\tAction queuedOperation = null;\n\t\t\tKeys? queuedBoundary = null;',
              'queue locals')

          replace_once(
              '\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(words));',
              '\t\t\t\t\tqueuedOperation = () => ConvertLast(words);',
              'multiple words defer')
          replace_once(
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(ConvertSelection);',
              '\t\t\t\t\t\t\t\tqueuedOperation = ConvertSelection;',
              'selection defer')
          replace_once(
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(word));',
              '\t\t\t\t\t\t\t\tqueuedOperation = () => ConvertLast(word);',
              'last word defer')
          replace_once(
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ConvertLast(line));',
              '\t\t\t\t\t\t\t\tqueuedOperation = () => ConvertLast(line);',
              'line defer')
          replace_once(
              '\t\t\t\t\t\t\t\tInputOperationQueue.Enqueue(() => ExpandSnippet(originalSnippet, replacement, removeCount));',
              '\t\t\t\t\t\t\t\tqueuedOperation = () => ExpandSnippet(originalSnippet, replacement, removeCount);',
              'snippet defer')
          replace_once(
              '\t\t\t\t\t\t\tInputOperationQueue.EnqueueBoundary(() => ConvertLast(autoWord), Keys.Enter);\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;',
              '\t\t\t\t\t\t\tqueuedOperation = () => ConvertLast(autoWord);\n\t\t\t\t\t\t\tqueuedBoundary = Keys.Enter;\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;',
              'enter boundary defer')
          replace_once(
              '\t\t\t\t\t\t\tInputOperationQueue.EnqueueBoundary(() => ConvertLast(autoWord), Keys.Space);\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;',
              '\t\t\t\t\t\t\tqueuedOperation = () => ConvertLast(autoWord);\n\t\t\t\t\t\t\tqueuedBoundary = Keys.Space;\n\t\t\t\t\t\t\tsuppressCurrentEvent = true;',
              'space boundary defer')

          replace_once(
              '\t\t\tif(suppressCurrentEvent)\n\t\t\t\treturn (IntPtr)1;\n\t\t\treturn CallNextHookEx(MMain._hookID, nCode, wParam, lParam);',
              '\t\t\tIntPtr hookResult = suppressCurrentEvent\n\t\t\t\t? (IntPtr)1\n\t\t\t\t: CallNextHookEx(MMain._hookID, nCode, wParam, lParam);\n\n\t\t\tif(queuedOperation != null) {\n\t\t\t\tif(queuedBoundary.HasValue)\n\t\t\t\t\tInputOperationQueue.EnqueueBoundary(queuedOperation, queuedBoundary.Value);\n\t\t\t\telse\n\t\t\t\t\tInputOperationQueue.Enqueue(queuedOperation);\n\t\t\t}\n\t\t\treturn hookResult;',
              'dispatch after hook')

          data = text.replace('\n', '\r\n').encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          path.write_bytes(data)
          Path('.github/workflows/defer-input-queue-dispatch.yml').unlink()
          '@ | Set-Content -Path defer_patch.py -Encoding utf8
          python defer_patch.py
          Remove-Item defer_patch.py

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Dispatch queued input after hook completion"
          git push origin HEAD:mixanizm-adaptive-layout-learning
