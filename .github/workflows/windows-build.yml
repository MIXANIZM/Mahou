name: Diagnose KMHook adaptive integration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: kmhook-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning

      - name: Count guarded patch locations
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          text = Path("Mahou/Classes/KMHook.cs").read_text(encoding="utf-8-sig")
          patterns = [
              ("manual correction", r'^(?P<i>[ \t]*)IfKeyIsMod\(Key\);\n(?P=i)var t = new Task\(new Action\(\(\) => ConvertLast\(MMain\.c_word\)\)\);$'),
              ("backspace", r'^(?P<i>[ \t]*)if\(Key == Keys\.Back\) \{ //Removes last item from current word when user press Backspace$'),
              ("navigation boundary", r'^(?P<i>[ \t]*)\(ctrl && Key != Keys\.None\)\) \{ //Ctrl modifier \+ Any key will clear word too\n(?P=i)MMain\.c_word\.Clear\(\);$'),
              ("space boundary", r'^(?P<i>[ \t]*)if\(Key == Keys\.Space\) \{\n(?P=i)\tMMain\.c_words\[MMain\.c_words\.Count - 1\]\.Add\(new YuKey\(\) \{ yukey = Keys\.Space \}\);$'),
              ("mouse boundary", r'^(?P<i>[ \t]*)MMain\.c_word\.Clear\(\);\n(?P=i)MMain\.c_words\.Clear\(\);\n(?P=i)if\(MMain\.MyConfs\.ReadBool\("Functions", "Snippets"\)\) \{$')
          ]

          lines = []
          for name, pattern in patterns:
              count = len(list(re.finditer(pattern, text, flags=re.MULTILINE)))
              lines.append(f"{name}: {count}")

          Path("patch-diagnostics.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          '@ | Set-Content -Path diagnose_kmhook.py -Encoding UTF8
          python diagnose_kmhook.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmhook-patch-diagnostics
          path: patch-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
