name: Inspect KMHook patch anchors

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: kmhook-anchor-inspection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-adaptive-layout-learning

      - name: Extract anchor context
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          text = Path("Mahou/Classes/KMHook.cs").read_text(encoding="utf-8-sig")
          anchors = [
              "IfKeyIsMod(Key);",
              "(ctrl && Key != Keys.None))",
              "if(Key == Keys.Space)",
              "MMain.c_words.Clear();"
          ]

          output = []
          for anchor in anchors:
              index = text.find(anchor)
              output.append("ANCHOR: " + anchor)
              output.append("INDEX: " + str(index))
              if index >= 0:
                  start = max(0, index - 180)
                  end = min(len(text), index + 360)
                  output.append(repr(text[start:end]))
              output.append("")

          Path("patch-anchor-context.txt").write_text("\n".join(output), encoding="utf-8")
          '@ | Set-Content -Path inspect_kmhook.py -Encoding UTF8
          python inspect_kmhook.py

      - name: Upload anchor context
        uses: actions/upload-artifact@v4
        with:
          name: kmhook-anchor-context
          path: patch-anchor-context.txt
          if-no-files-found: error
          retention-days: 1
