name: Windows build

on:
  push:
    branches:
      - mixanizm-adaptive-layout-learning
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore Mahou/Mahou.sln -NonInteractive

      - name: Build Release x86
        run: msbuild Mahou/Mahou.sln /m /p:Configuration=Release /p:Platform=x86 /v:minimal
