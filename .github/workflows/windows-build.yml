name: Windows build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore Mahou/Mahou.sln -NonInteractive

      - name: Build Release x86
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild Mahou/Mahou.sln /m /p:Configuration=Release /p:Platform=x86 /v:minimal /fl /flp:"logfile=msbuild.log;verbosity=normal"
          Set-Content -Path build-exit-code.txt -Value $LASTEXITCODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: |
            msbuild.log
            build-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MIXANIZM-Mahou-windows-x86
          path: |
            Mahou/bin/Release/Mahou.exe
            Mahou/bin/Release/Mahou.exe.config
          if-no-files-found: error
          retention-days: 14

      - name: Fail job when build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
