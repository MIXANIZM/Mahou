name: Apply project metadata cleanup

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-project-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'mixanizm-modern-v2.9.0.1' || github.ref_name == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0
          show-progress: false

      - name: Apply project metadata cleanup
        shell: bash
        run: |
          set -o pipefail
          mkdir -p project-cleanup-diagnostics
          script=.github/scripts/apply-project-cleanup.py
          if [ ! -f "$script" ]; then
            echo 'Project metadata cleanup is already applied.' | tee project-cleanup-diagnostics/result.txt
            exit 0
          fi
          python3 "$script" 2>&1 | tee project-cleanup-diagnostics/result.txt
          python3 .github/scripts/security-regression.py 2>&1 | tee -a project-cleanup-diagnostics/result.txt
          git config core.whitespace cr-at-eol
          git diff --check 2>&1 | tee -a project-cleanup-diagnostics/result.txt
          rm -f .github/workflows/apply-project-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: clean obsolete project metadata and embed manifest'
          git push origin HEAD:mixanizm-modern-v2.9.0.1

      - name: Upload project cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-cleanup-diagnostics
          path: project-cleanup-diagnostics
          if-no-files-found: warn
          retention-days: 3
