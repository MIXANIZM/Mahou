name: Transfer verified Notepad adapter to clean branch

on:
  pull_request:
    branches:
      - mixanizm-modern-v2.9.0.1

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: transfer-notepad-adapter-clean
  cancel-in-progress: false

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agz-mah-0003-notepad-direct-adapter
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify reviewed archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import urllib.request

          def compact(path):
              if not path.is_file():
                  raise SystemExit('Missing staging payload: ' + str(path))
              return ''.join(path.read_text(encoding='utf-8').split())

          chunks = []
          for number in range(4):
              value = compact(Path('.github/patches/agz-mah-0003.part%02d' % number))
              if len(value) != 8000:
                  raise SystemExit('Unexpected part%02d length: %d' % (number, len(value)))
              chunks.append(value)

          part04 = ''.join(
              compact(Path('.github/patches/agz-mah-0003.part04' + suffix))
              for suffix in ('a', 'b', 'c', 'd')
          )
          if len(part04) != 8000:
              raise SystemExit('Unexpected combined part04 length: %d' % len(part04))
          if hashlib.sha256(part04.encode('ascii')).hexdigest() != '0b657a205fc27cf2d185fe2de3e71edeb213e566331e30dc13bf62a3d84e5e00':
              raise SystemExit('Combined part04 SHA-256 mismatch')
          chunks.append(part04)

          requirements = {
              'AGZ-MAH-0003-PAYLOAD-05-06': None,
              'AGZ-MAH-0003-PAYLOAD-07-08': None,
              'AGZ-MAH-0003-PAYLOAD-09-10': '4a193aaca784f33159e44e62684e5d674ee3d6372ffff13eb65bc69f86083d11',
              'AGZ-MAH-0003-PAYLOAD-11-12': None,
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/MIXANIZM/Mahou/issues/3/comments?per_page=100',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comments = json.load(response)

          selected = {}
          for marker, required_sha in requirements.items():
              prefix = marker + '\n'
              candidates = [
                  ''.join((comment.get('body') or '')[len(prefix):].split())
                  for comment in comments
                  if (comment.get('body') or '').startswith(prefix)
              ]
              if not candidates:
                  raise SystemExit('Missing payload marker: ' + marker)
              if required_sha:
                  candidates = [
                      value for value in candidates
                      if hashlib.sha256(value.encode('ascii')).hexdigest() == required_sha
                  ]
                  if not candidates:
                      raise SystemExit('No matching SHA-256 candidate for: ' + marker)
              if any(value != candidates[0] for value in candidates):
                  raise SystemExit('Conflicting candidates for: ' + marker)
              selected[marker] = candidates[0]

          chunks.extend([
              selected['AGZ-MAH-0003-PAYLOAD-05-06'],
              selected['AGZ-MAH-0003-PAYLOAD-07-08'],
              selected['AGZ-MAH-0003-PAYLOAD-09-10'],
              selected['AGZ-MAH-0003-PAYLOAD-11-12'],
          ])
          payload = ''.join(chunks)
          if len(payload) != 100840:
              raise SystemExit('Unexpected total base64 length: %d' % len(payload))
          Path('/tmp/agz-mah-0003.b64').write_text(payload, encoding='ascii')
          print('Reconstructed exact base64 payload:', len(payload))
          PY
          base64 -d /tmp/agz-mah-0003.b64 > /tmp/agz-mah-0003.tar.gz
          test "$(wc -c < /tmp/agz-mah-0003.tar.gz)" -eq 75630
          printf '%s  %s\n' \
            'f03144f011bd712d5ec46ab58b6d8602deb8d9043a82617512f0b6072b43a9af' \
            '/tmp/agz-mah-0003.tar.gz' | sha256sum -c -
          tar -tzf /tmp/agz-mah-0003.tar.gz | sort > /tmp/agz-mah-0003-actual-files.txt
          cat > /tmp/agz-mah-0003-expected-files.txt <<'EOF'
          .github/scripts/security-regression.py
          .github/tests/InsertSafetyRegression.cs
          ARCHITECTURE.md
          CHANGELOG.md
          ISSUES.md
          KNOWN-LIMITATIONS.md
          Mahou/Classes/KMHook.cs
          Mahou/Classes/SelectionProbe.cs
          Mahou/Classes/SmartCaps.cs
          README-MIXANIZM.md
          SECURITY.md
          TEST-PLAN-WINDOWS11.md
          TESTING.md
          UNIVERSAL-CHAT-HANDOFF.md
          EOF
          sort -o /tmp/agz-mah-0003-expected-files.txt /tmp/agz-mah-0003-expected-files.txt
          diff -u /tmp/agz-mah-0003-expected-files.txt /tmp/agz-mah-0003-actual-files.txt

      - name: Apply archive to clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agz-mah-0003-notepad-adapter-clean
          git checkout -B agz-mah-0003-notepad-adapter-clean origin/agz-mah-0003-notepad-adapter-clean
          python3 - <<'PY'
          from pathlib import Path
          import json

          names = [
              '.github/scripts/security-regression.py',
              '.github/tests/InsertSafetyRegression.cs',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'ISSUES.md',
              'KNOWN-LIMITATIONS.md',
              'Mahou/Classes/KMHook.cs',
              'Mahou/Classes/SelectionProbe.cs',
              'Mahou/Classes/SmartCaps.cs',
              'README-MIXANIZM.md',
              'SECURITY.md',
              'TEST-PLAN-WINDOWS11.md',
              'TESTING.md',
              'UNIVERSAL-CHAT-HANDOFF.md',
          ]
          bom = b'\xef\xbb\xbf'
          metadata = {}
          for name in names:
              raw = Path(name).read_bytes()
              has_bom = raw.startswith(bom)
              body = raw[len(bom):] if has_bom else raw
              metadata[name] = {'bom': has_bom, 'crlf': b'\r\n' in body}
          Path('/tmp/agz-mah-0003-formats.json').write_text(
              json.dumps(metadata, sort_keys=True), encoding='utf-8'
          )
          PY
          tar -xzf /tmp/agz-mah-0003.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import json

          bom = b'\xef\xbb\xbf'
          metadata = json.loads(Path('/tmp/agz-mah-0003-formats.json').read_text(encoding='utf-8'))
          for name, info in metadata.items():
              path = Path(name)
              raw = path.read_bytes()
              if raw.startswith(bom):
                  raw = raw[len(bom):]
              raw = raw.replace(b'\r\n', b'\n')
              if info['crlf']:
                  raw = raw.replace(b'\n', b'\r\n')
              if info['bom']:
                  raw = bom + raw
              path.write_bytes(raw)
          PY

      - name: Verify safety and exact clean diff
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/scripts/security-regression.py',
              '.github/tests/InsertSafetyRegression.cs',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'ISSUES.md',
              'KNOWN-LIMITATIONS.md',
              'Mahou/Classes/KMHook.cs',
              'Mahou/Classes/SelectionProbe.cs',
              'Mahou/Classes/SmartCaps.cs',
              'README-MIXANIZM.md',
              'SECURITY.md',
              'TEST-PLAN-WINDOWS11.md',
              'TESTING.md',
              'UNIVERSAL-CHAT-HANDOFF.md',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Clean diff mismatch: expected=%r actual=%r' % (sorted(expected), sorted(actual)))
          print('Clean product diff verified:', len(actual))
          PY

      - name: Commit and push clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'AGZ-MAH-0003: add verified direct Notepad adapter'
          git push origin HEAD:agz-mah-0003-notepad-adapter-clean
