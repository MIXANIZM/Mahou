name: Modern Windows build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Apply staged security hardening atomically
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/apply-modern-hardening.py ]; then
            python3 .github/scripts/apply-modern-hardening.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'security: harden modern Mahou baseline'
            git push origin HEAD:mixanizm-modern-v2.9.0.1
          else
            echo 'No staged hardening script remains.'
          fi

      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-hardening-diagnostics-main
          path: hardening-diagnostics
          if-no-files-found: warn
          retention-days: 3

  build:
    needs: apply-hardening
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]

    steps:
      - name: Checkout hardened modern branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1

      - name: Package source snapshot
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source-snapshot | Out-Null
          git archive --format=zip --output=source-snapshot/MIXANIZM-Mahou-modern-source.zip HEAD

      - name: Upload source snapshot
        if: matrix.platform == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: MIXANIZM-Mahou-modern-source
          path: source-snapshot/MIXANIZM-Mahou-modern-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Stamp source commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $source = 'static class ____ { public static string commit="' + $commit + '"; }'
          Set-Content -Path Mahou/____commit.cs -Value $source -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release ${{ matrix.platform }}
        shell: pwsh
        run: |
          msbuild Mahou/Mahou.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal /fl /flp:"logfile=msbuild-${{ matrix.platform }}.log;verbosity=normal"

      - name: Collect build
        shell: pwsh
        run: |
          $source = if ("${{ matrix.platform }}" -eq "x86") { "Mahou/bin/Release_x86" } else { "Mahou/bin/Release_x64" }
          if (-not (Test-Path $source)) { throw "Build output not found: $source" }
          $dest = "release/${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$source/*" $dest -Recurse -Force
          Get-ChildItem $dest -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          Get-FileHash "$dest/Mahou.exe" -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLowerInvariant() + " *Mahou.exe" } | Set-Content "$dest/SHA256SUMS.txt" -Encoding utf8

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-build-log-${{ matrix.platform }}
          path: msbuild-${{ matrix.platform }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MIXANIZM-Mahou-modern-${{ matrix.platform }}
          path: release/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
