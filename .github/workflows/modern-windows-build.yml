name: Apply strict Edit allowlist once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-strict-edit-allowlist-pr
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/restrict-standard-edit.patch.b64 > /tmp/restrict-standard-edit.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Mahou/Classes/SelectionProbe.cs')
          raw = path.read_bytes()
          bom = b'\xef\xbb\xbf'
          has_bom = raw.startswith(bom)
          if has_bom:
              raw = raw[len(bom):]
          crlf = b'\r\n' in raw
          Path('/tmp/selection-probe-meta').write_text(('1' if has_bom else '0') + ('1' if crlf else '0'))
          path.write_bytes(raw.decode('utf-8').replace('\r\n', '\n').encode('utf-8'))
          patch = Path('/tmp/restrict-standard-edit.patch')
          patch.write_bytes(patch.read_bytes().replace(b'\r\n', b'\n'))
          PY
          patch -p1 --dry-run < /tmp/restrict-standard-edit.patch
          patch -p1 < /tmp/restrict-standard-edit.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Mahou/Classes/SelectionProbe.cs')
          meta = Path('/tmp/selection-probe-meta').read_text()
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          raw = (text.replace('\n', '\r\n') if meta[1] == '1' else text).encode('utf-8')
          if meta[0] == '1':
              raw = b'\xef\xbb\xbf' + raw
          path.write_bytes(raw)
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py
          python3 .github/scripts/ui-resource-regression.py
          grep -Fq 'IsSupportedStandardEditClass' Mahou/Classes/SelectionProbe.cs
          grep -Fq 'String.Equals(className, "Edit", StringComparison.OrdinalIgnoreCase)' Mahou/Classes/SelectionProbe.cs
          ! grep -Fq 'IndexOf("Edit", StringComparison.OrdinalIgnoreCase)' Mahou/Classes/SelectionProbe.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mahou/Classes/SelectionProbe.cs
          git commit -m 'fix: restrict Insert to classic Edit controls'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
