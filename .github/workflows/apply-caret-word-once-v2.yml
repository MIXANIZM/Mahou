name: Apply caret word conversion once v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-caret-word-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Decode exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          source = Path('.github/workflows/apply-caret-word-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode > /tmp/caret-word\.patch",
              source,
          )
          if not match:
              raise SystemExit('Embedded caret-word patch was not found.')
          Path('/tmp/caret-word.patch').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY
          sha256sum /tmp/caret-word.patch | tee /tmp/caret-word-report.txt
          grep -q '^d254786012ea7827f8f241cd81186093bda3bbcf5f77eca531d9427ebf185132 ' /tmp/caret-word-report.txt

      - name: Normalize, apply and restore line endings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          paths = [
              '.github/scripts/security-regression.py',
              'Mahou/Classes/KMHook.cs',
              'Mahou/Classes/SelectionProbe.cs',
          ]
          styles = {}
          for name in paths:
              path = Path(name)
              raw = path.read_bytes()
              styles[name] = 'crlf' if b'\r\n' in raw else 'lf'
              path.write_bytes(raw.replace(b'\r\n', b'\n'))

          patch = Path('/tmp/caret-word.patch').read_bytes().replace(b'\r\n', b'\n')
          Path('/tmp/caret-word-lf.patch').write_bytes(patch)
          Path('/tmp/caret-word-newlines.json').write_text(json.dumps(styles), encoding='utf-8')
          print(styles)
          PY

          if git apply --check /tmp/caret-word-lf.patch; then
            git apply /tmp/caret-word-lf.patch
            echo 'Patch applied after line-ending normalization.' | tee -a /tmp/caret-word-report.txt
          elif git apply --reverse --check /tmp/caret-word-lf.patch; then
            echo 'Patch was already applied.' | tee -a /tmp/caret-word-report.txt
          else
            echo 'Normalized patch does not match the current branch.' | tee -a /tmp/caret-word-report.txt
            git apply --check --verbose /tmp/caret-word-lf.patch 2>&1 | tee -a /tmp/caret-word-report.txt
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json

          styles = json.loads(Path('/tmp/caret-word-newlines.json').read_text(encoding='utf-8'))
          for name, style in styles.items():
              path = Path(name)
              raw = path.read_bytes().replace(b'\r\n', b'\n')
              if style == 'crlf':
                  raw = raw.replace(b'\n', b'\r\n')
              path.write_bytes(raw)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/security-regression.py | tee -a /tmp/caret-word-report.txt
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/scripts/security-regression.py'),
              Path('Mahou/Classes/KMHook.cs'),
              Path('Mahou/Classes/SelectionProbe.cs'),
          ]
          errors = []
          for path in paths:
              raw = path.read_bytes()
              for number, line in enumerate(raw.splitlines(), 1):
                  if line.rstrip(b' \t') != line:
                      errors.append(f'{path}:{number}: trailing space or tab')
                  if line.startswith((b'<<<<<<<', b'=======', b'>>>>>>>')):
                      errors.append(f'{path}:{number}: merge-conflict marker')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Whitespace and conflict-marker check passed.')
          PY
          git status --short | tee -a /tmp/caret-word-report.txt

      - name: Commit code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/security-regression.py \
            Mahou/Classes/KMHook.cs \
            Mahou/Classes/SelectionProbe.cs
          if git diff --cached --quiet; then
            echo 'No code changes remain to commit.' | tee -a /tmp/caret-word-report.txt
            exit 0
          fi
          git commit -m 'feat: convert word before caret with Insert'
          git rev-parse HEAD | tee -a /tmp/caret-word-report.txt

      - name: Push code commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:mixanizm-modern-v2.9.0.1

      - name: Upload apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caret-word-apply-report
          path: /tmp/caret-word-report.txt
          if-no-files-found: warn
          retention-days: 7
