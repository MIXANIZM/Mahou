name: Apply caret word conversion once v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-caret-word-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mixanizm-modern-v2.9.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: mixanizm-modern-v2.9.0.1
          fetch-depth: 0

      - name: Apply and verify caret-word conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          source = Path('.github/workflows/apply-caret-word-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode > /tmp/caret-word\.patch",
              source,
          )
          if not match:
              raise SystemExit('Embedded caret-word patch was not found.')
          Path('/tmp/caret-word.patch').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY

          patch=/tmp/caret-word.patch
          if git apply --check "$patch"; then
            git apply "$patch"
          elif git apply --reverse --check "$patch"; then
            echo 'Caret-word patch is already applied.'
          else
            echo 'Caret-word patch does not match the current branch.' >&2
            exit 1
          fi

          python3 .github/scripts/security-regression.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/security-regression.py \
            Mahou/Classes/KMHook.cs \
            Mahou/Classes/SelectionProbe.cs
          if git diff --cached --quiet; then
            echo 'No code changes remain to commit.'
            exit 0
          fi
          git commit -m 'feat: convert word before caret with Insert'
          git push origin HEAD:mixanizm-modern-v2.9.0.1
